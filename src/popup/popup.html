<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="../../icons/icon48.png" alt="" width="28" height="28" />
      <h1>Night Owl</h1>
      <button id="open-tab" class="link" hidden>Open in tab ↗</button>
    </header>

    <section class="card">
      <h2>Your Sleeper account</h2>
      <div class="row">
        <input id="username" type="text" placeholder="Sleeper username" spellcheck="false" aria-label="Sleeper username" />
        <button id="save-user">Save</button>
      </div>
      <p id="user-status" class="status"></p>
      <label class="switch-row">
        <input id="alerts" type="checkbox" />
        <span><b>Lineup alerts</b><span class="muted">A notification when a starter is ruled out or on bye before kickoff.</span></span>
      </label>
    </section>

    <section class="card">
      <h2>Draft rankings <span id="synced" class="muted"></span></h2>
      <div class="row">
        <select id="format" aria-label="Scoring"></select>
        <button id="sync">Sync from Ringer</button>
      </div>
      <p id="rank-status" class="status"></p>
      <div class="row add">
        <input id="add-name" type="text" placeholder="Add a player" aria-label="Player name" />
        <input id="add-pos" type="text" placeholder="Pos" maxlength="4" aria-label="Position" />
        <input id="add-team" type="text" placeholder="Team" maxlength="4" aria-label="Team" />
        <button id="add" class="quiet" aria-label="Add player">Add</button>
      </div>
      <ol id="list"></ol>
      <div class="foot">
        <span class="muted">Drag to reorder</span>
        <span class="links"><button id="export" class="link">Export</button><button id="import" class="link">Import</button></span>
      </div>
      <input id="import-file" type="file" accept="application/json" hidden />
    </section>

    <script src="../shared/storage.js"></script>
    <script src="../shared/format.js"></script>
    <script src="../shared/api.js"></script>
    <script src="../draft/ringer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
